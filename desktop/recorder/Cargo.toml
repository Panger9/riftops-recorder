[package]
name = "riftops-recorder"
version = "0.1.0"
description = "Records the League of Legends game window for the RiftOps desktop app"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "riftops-recorder"
path = "src/main.rs"

[dependencies]
# libobs is GPL-2.0-or-later. This program runs as its own process next to the
# desktop app and talks to it over stdin and stdout only.
libobs-simple = { version = "=8.0.1", default-features = false, features = ["window-list"] }
libobs-window-helper = "=0.4.0"
libobs-wrapper = { version = "=9.0.4", default-features = false }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
strip = true
